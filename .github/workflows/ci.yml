name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Tests were removed from the CI workflow. Use the manual `testing` workflow
      # to run tests on-demand via the GitHub Actions UI (workflow_dispatch).

# NOTE: Packaging and publishing were removed from this CI workflow so releases are intentional.
# Use the manual workflow `.github/workflows/manual-pack-publish.yml` to pack and publish NuGet packages.
